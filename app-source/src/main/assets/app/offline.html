<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Нет соединения</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: #0E1116;
            color: #E6EAF2;
            font-family: -apple-system, Roboto, "Segoe UI", system-ui, sans-serif;
            padding: 24px;
            text-align: center;
        }
        .icon {
            width: 76px; height: 76px; border-radius: 50%;
            background: rgba(255,183,77,.12);
            display: flex; align-items: center; justify-content: center;
            font-size: 34px;
        }
        h1 { font-size: 20px; margin: 0; }
        p { margin: 0; color: #8A94A6; font-size: 14px; line-height: 1.5; max-width: 420px; }
        code { color: #4C8DFF; font-size: 12px; word-break: break-all; }
        button {
            margin-top: 6px;
            background: #4C8DFF; color: #fff; border: 0;
            padding: 12px 26px; border-radius: 10px;
            font-size: 15px; font-weight: 600; cursor: pointer;
        }
        button:active { opacity: .75; }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>Нет соединения с сервером</h1>
    <p>
        Не удалось загрузить содержимое приложения и показать сохранённую страницу 404.
        Проверьте подключение и повторите попытку.
    </p>
    <!--REASON-->
    <p><code id="url">control</code></p>
    <p><code id="index"></code></p>
    <button onclick="retry()">Повторить</button>
    <script>
        function retry() {
            var b = window.Android || window.Native || window.Tornado;
            if (b && typeof b.refresh === 'function') {
                b.refresh();
            } else {
                location.reload();
            }
        }
        try {
            var b = window.Android || window.Native;
            if (b && typeof b.getControlUrl === 'function') {
                document.getElementById('url').textContent = b.getControlUrl();
            }
            if (b && typeof b.getIndexUrl === 'function') {
                var i = b.getIndexUrl();
                document.getElementById('index').textContent = i || '';
            }
        } catch (e) {}
    </script>
</body>
</html>
